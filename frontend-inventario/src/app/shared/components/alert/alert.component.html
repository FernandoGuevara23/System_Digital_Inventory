<div class="alert" [class]="'alert--' + type" role="alert">
  <span class="alert__icon" aria-hidden="true">
    @switch (type) {
      @case ('success') { ✓ }
      @case ('error') { ! }
      @case ('warning') { ! }
      @case ('orange') { ! }
      @default { i }
    }
  </span>

  <div class="alert__content">
    @if (title) {
      <strong>{{ title }}</strong>
    }
    <span>{{ message }}</span>
  </div>

  @if (dismissible) {
    <button type="button" class="alert__close" aria-label="Cerrar alerta" (click)="cerrar()">×</button>
  }
</div>
