<main class="login-page">
  <section class="login-branding" aria-label="Inventario IT">
    <div class="brand-topline">
      <span class="brand-mark" aria-hidden="true">IT</span>
      <span class="brand-name">Inventario <strong>IT</strong></span>
    </div>

    <div class="brand-content">
     <div class="badge-container">
    <p class="environment-badge" >Marquardt</p>
    <p class="environment-badge">DEV- FAGR</p>
      </div>
      <div class="brand-decoration" aria-hidden="true">
        <span class="decoration-orbit orbit-one"></span>
        <span class="decoration-orbit orbit-two"></span>
        <span class="decoration-core"><span>IT</span></span>
        <span class="decoration-dot dot-one"></span>
        <span class="decoration-dot dot-two"></span>
        <span class="decoration-dot dot-three"></span>
      </div>
    
    </div>
  </section>

  <section class="login-main">
    <div class="login-card">
      <div class="mobile-brand">
        <span class="brand-mark" aria-hidden="true">IT</span>
        <span class="brand-name">Inventario <strong>IT</strong></span>
      </div>

      <div class="form-heading">
        <p class="environment-badge environment-badge-mobile">DEV- FAGR</p>
        <h2>Bienvenido</h2>
      </div>

      @if (error) {
        <app-alert
          type="error"
          title="No se pudo iniciar sesión"
          [message]="error"
          (dismissed)="error = null"
        />
      }

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="login-form">
        <div class="form-group">
          <label for="username">Usuario</label>
          <div class="input-wrapper">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="8" r="3.5"></circle>
                <path d="M5 20c.5-3.2 3.2-5.2 7-5.2s6.5 2 7 5.2"></path>
              </svg>
            </span>
            <input
              type="text"
              id="username"
              formControlName="username"
              placeholder="Ingresa tu usuario"
              [disabled]="cargando"
              [attr.aria-invalid]="loginForm.get('username')?.invalid && loginForm.get('username')?.touched"
              autocomplete="username"
              autocapitalize="none"
              spellcheck="false"
              class="form-input"
            />
            <span class="input-valid" *ngIf="loginForm.get('username')?.valid && !loginForm.get('username')?.pristine" aria-label="Usuario válido">✓</span>
          </div>
          <span *ngIf="loginForm.get('username')?.invalid && loginForm.get('username')?.touched" class="error-text">
            Ingresa un usuario válido.
          </span>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div class="input-wrapper">
            <span class="field-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="5" y="10" width="14" height="10" rx="2"></rect>
                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                <path d="M12 14v2"></path>
              </svg>
            </span>
            <input
              type="password"
              id="password"
              formControlName="password"
              placeholder="Ingresa tu contraseña"
              [disabled]="cargando"
              [attr.aria-invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
              autocomplete="current-password"
              class="form-input"
            />
            <span class="input-valid" *ngIf="loginForm.get('password')?.valid && !loginForm.get('password')?.pristine" aria-label="Contraseña válida">✓</span>
          </div>
          <span *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" class="error-text">
            La contraseña debe tener al menos 6 caracteres.
          </span>
        </div>

        <button
          type="submit"
          [disabled]="cargando || loginForm.invalid"
          [attr.aria-busy]="cargando"
          class="btn-login"
        >
          <span *ngIf="!cargando">Iniciar sesión</span>
          <span *ngIf="cargando" class="loading-spinner" aria-hidden="true"></span>
          <span *ngIf="cargando">Verificando acceso...</span>
          <svg *ngIf="!cargando" class="button-arrow" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M5 12h14m-6-6 6 6-6 6"></path>
          </svg>
        </button>
      </form>

      <p class="security-note">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <rect x="5" y="10" width="14" height="10" rx="2"></rect>
          <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
        </svg>
      Inventario IT
      </p>
    </div>
  </section>
</main>
